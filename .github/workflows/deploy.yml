name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# a run on another branch (workflow_dispatch) tests and builds, and deploys nothing
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # which Playwright the lockfile pins: its image has both browsers and what they need
  versions:
    runs-on: ubuntu-latest
    outputs:
      playwright: ${{ steps.pinned.outputs.playwright }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Playwright's version
        id: pinned
        run: echo "playwright=$(grep -oE 'playwright@[0-9]+\.[0-9]+\.[0-9]+' bun.lock | head -1 | cut -d@ -f2)" >> "$GITHUB_OUTPUT"

  build:
    needs: versions
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.versions.outputs.playwright }}-noble
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        # pinned, not `latest`: a floating Bun already broke the build once
        # (the stale-bundle bug fixed by 1.3.14). Bump deliberately. From npm,
        # with the Node the image has.
        run: npm install --global bun@1.3.14

      - name: Install dependencies
        # frozen: the deployed tree is exactly the lockfile
        run: bun install --frozen-lockfile

      # a red commit must not reach the playground – gate the deploy
      - name: Typecheck
        run: bunx tsc --noEmit

      # three processes, as the suite runs locally: the host is one per process and
      # answers every write, so the gallery's demos and the host's tests each get their own
      - name: Test (language)
        run: "bun test ./tests.ts -t '^(?!gallery examples smoke suite|the evaluation host)'"

      - name: Test (gallery)
        run: "bun test ./tests.ts -t '^gallery examples smoke suite'"

      - name: Test (host)
        run: "bun test ./tests.ts -t '^the evaluation host'"

      - name: Test (engine, CPU)
        run: bun run test:engine

      - name: Test (browser)
        run: npx playwright test

      - name: Build
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
